name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the root package.json "packageManager" field.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source headers
        # Every tracked .ts/.py file must carry the @author zhangbaohong header.
        run: pnpm check:headers

      - name: Build and test
        # Root "test" script = build + run compiled tests for every package.
        run: pnpm test

      - name: Test render worker (Python)
        # ffmpeg-free unit tests always run; the e2e suite self-skips without
        # ffmpeg (ubuntu-latest ships it, so it runs here).
        run: pnpm test:worker
