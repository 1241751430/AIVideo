defaults:
  profile: default
  aspectRatio: 9:16
  durationSeconds: 30
  language: zh-CN
  platform: douyin
  projectsDir: project

providers:
  local-rule-text:
    type: local-rule-text
    capability: text
    vendor: builtin
    enabled: true
    description: 离线规则文案生成器

  local-say:
    type: local-say
    capability: speech
    vendor: builtin
    enabled: true
    description: macOS say 本地配音

  noop-image:
    type: noop-image
    capability: image
    vendor: builtin
    enabled: true
    description: 没有图片模型时，用参考图或标题卡片出片

  noop-video:
    type: noop-video
    capability: video
    vendor: builtin
    enabled: true
    description: 预留远程视频模型接口

  openai-text:
    type: openai-compatible
    capability: text
    vendor: openai
    enabled: true
    baseURL: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY
    modelEnv: OPENAI_MODEL
    model: gpt-4.1-mini

  aliyun-text:
    type: openai-compatible
    capability: text
    vendor: aliyun
    enabled: true
    baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
    apiKeyEnv: DASHSCOPE_API_KEY
    modelEnv: DASHSCOPE_MODEL
    model: qwen-plus

  volcengine-text:
    type: openai-compatible
    capability: text
    vendor: volcengine
    enabled: true
    baseURL: https://ark.cn-beijing.volces.com/api/v3
    apiKeyEnv: ARK_API_KEY
    modelEnv: ARK_MODEL
    model: doubao-1.5-pro-32k-250115

profiles:
  default:
    text: local-rule-text
    image: noop-image
    video: noop-video
    speech: local-say

  openai:
    text: openai-text
    image: noop-image
    video: noop-video
    speech: local-say

  china:
    text: aliyun-text
    image: noop-image
    video: noop-video
    speech: local-say

  volcengine:
    text: volcengine-text
    image: noop-image
    video: noop-video
    speech: local-say
