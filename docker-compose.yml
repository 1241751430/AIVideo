services:
  aivideo:
    build:
      context: .
      dockerfile: Dockerfile
    image: aivideo-agent:local
    working_dir: /app
    entrypoint: ["node", "apps/cli/dist/index.js"]
    command: ["help"]
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      AIVIDEO_CONTAINER: "1"
    volumes:
      - ./project:/app/project
