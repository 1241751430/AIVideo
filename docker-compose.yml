services:
  aivideo:
    build:
      context: .
      dockerfile: Dockerfile
    image: aivideo-agent:local
    working_dir: /app
    entrypoint: ["node", "apps/cli/dist/index.js"]
    command: ["help"]
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      AIVIDEO_CONTAINER: "1"
    volumes:
      - ./project:/app/project

  # 常驻工作台服务：容器内监听 0.0.0.0，仅映射到宿主 127.0.0.1（本机使用，无鉴权）。
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: aivideo-agent:local
    working_dir: /app
    entrypoint: ["node", "apps/server/dist/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      AIVIDEO_CONTAINER: "1"
      AIVIDEO_SERVER_HOST: "0.0.0.0"
      AIVIDEO_SERVER_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./project:/app/project
    restart: unless-stopped
